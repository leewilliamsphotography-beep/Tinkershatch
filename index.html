<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Space Grotesk', sans-serif;
    background: #0a0a1f;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Animated gradient background */
  .bg-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(-45deg, #ff006e, #fb5607, #ffbe0b, #8338ec, #3a86ff, #06d6a0);
    background-size: 400% 400%;
    animation: gradientFlow 18s ease infinite;
    z-index: 0;
  }

  @keyframes gradientFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating colorful orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.7;
    z-index: 1;
    animation: float 12s ease-in-out infinite;
  }
  .orb-1 { width: 280px; height: 280px; background: #ff006e; top: 10%;  left: 8%;  animation-delay: 0s; }
  .orb-2 { width: 220px; height: 220px; background: #ffbe0b; bottom: 15%; right: 10%; animation-delay: -3s; }
  .orb-3 { width: 180px; height: 180px; background: #06d6a0; top: 60%; left: 20%; animation-delay: -6s; }
  .orb-4 { width: 200px; height: 200px; background: #3a86ff; top: 15%; right: 25%; animation-delay: -9s; }

  @keyframes float {
    0%, 100% { transform: translate(0,0) scale(1); }
    33%      { transform: translate(40px,-30px) scale(1.1); }
    66%      { transform: translate(-30px,40px) scale(0.95); }
  }

  /* Dark overlay for text readability */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 31, 0.55);
    z-index: 2;
  }

  /* Main content */
  .content {
    position: relative;
    z-index: 3;
    text-align: center;
    color: #fff;
    padding: 2rem;
    max-width: 720px;
  }

  .badge {
    display: inline-block;
    padding: 0.4rem 1rem;
    border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 999px;
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 1.8rem;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.08);
    animation: fadeUp 0.8s ease both;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(3.5rem, 12vw, 8rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 1.2rem;
    animation: fadeUp 0.8s ease 0.15s both;
  }

  h1 .accent {
    font-style: italic;
    font-weight: 300;
    background: linear-gradient(90deg, #ffbe0b, #ff006e, #8338ec);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    font-size: clamp(1rem, 2vw, 1.25rem);
    font-weight: 400;
    color: rgba(255,255,255,0.85);
    max-width: 540px;
    margin: 0 auto 2.5rem;
    line-height: 1.6;
    animation: fadeUp 0.8s ease 0.3s both;
  }

  .actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 0.8s ease 0.45s both;
  }

  .btn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 0.95rem 2.2rem;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    letter-spacing: 0.02em;
  }

  .btn-primary {
    background: #fff;
    color: #0a0a1f;
    box-shadow: 0 10px 30px rgba(255,255,255,0.25);
  }
  .btn-primary:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 15px 40px rgba(255,255,255,0.45);
  }

  .btn-secondary {
    background: transparent;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.6);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.12);
    transform: translateY(-3px);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Bottom hint */
  .hint {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    color: rgba(255,255,255,0.6);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: fadeUp 0.8s ease 0.6s both;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  <div class="overlay"></div>

  <main class="content">
    <span class="badge">Hello there</span>
    <h1>Welcome<br><span class="accent">aboard</span></h1>
    <p class="subtitle">Step into a world bursting with color and curiosity. Your vibrant journey starts right here, right now.</p>
    <div class="actions">
      <button class="btn btn-primary" id="exploreBtn">Get Started</button>
      <button class="btn btn-secondary" id="learnBtn">Learn More</button>
    </div>
  </main>

  <div class="hint">Scroll · Click · Explore</div>

<script>
  // Tiny bit of interactivity: button reacts with a confetti burst
  const exploreBtn = document.getElementById('exploreBtn');
  const learnBtn = document.getElementById('learnBtn');

  function popConfetti(x, y) {
    const colors = ['#ff006e','#fb5607','#ffbe0b','#8338ec','#3a86ff','#06d6a0'];
    for (let i = 0; i < 30; i++) {
      const dot = document.createElement('div');
      const size = Math.random() * 8 + 4;
      Object.assign(dot.style, {
        position: 'fixed',
        left: x + 'px',
        top: y + 'px',
        width: size + 'px',
        height: size + 'px',
        background: colors[Math.floor(Math.random()*colors.length)],
        borderRadius: Math.random() > 0.5 ? '50%' : '2px',
        zIndex: 9999,
        pointerEvents: 'none',
        transition: 'all 1.2s cubic-bezier(0.2, 0.7, 0.3, 1)'
      });
      document.body.appendChild(dot);
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 220 + 80;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 80;
      requestAnimationFrame(() => {
        dot.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.random()*720}deg)`;
        dot.style.opacity = '0';
      });
      setTimeout(() => dot.remove(), 1300);
    }
  }

  exploreBtn.addEventListener('click', e => {
    popConfetti(e.clientX, e.clientY);
    exploreBtn.textContent = 'Let\'s go!';
  });

  learnBtn.addEventListener('click', e => {
    popConfetti(e.clientX, e.clientY);
  });

  // Subtle parallax on mouse move
  document.addEventListener('mousemove', e => {
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;
    document.querySelectorAll('.orb').forEach((orb, i) => {
      const mult = (i + 1) * 0.4;
      orb.style.translate = `${x * mult}px ${y * mult}px`;
    });
  });
</script>
</body>
</html>
