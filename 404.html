<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Lost in the Garden | Tinkers Hatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
    /* Fallback Variables (in case style.css isn't loaded on this specific page) */
    :root {
        --cream: #FDFCF8;
        --cream-deep: #F7F4ED;
        --card: #FFFFFF;
        --border: #EAE6DC;
        --bark: #2C2420;
        --bark-soft: #6B5D52;
        --terracotta: #C25528;
        --teal: #2A6F65;
        --teal-deep: #1F524A;
        --sage: #8AA68B;
        --honey: #D4A537;
        --rose: #D68282;
    }

    * {
        box-sizing: border-box;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--cream);
        overflow: hidden;
        position: relative;
        margin: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: var(--bark);
    }

    /* Ambient Background Elements */
    .bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.15;
        z-index: 0;
        pointer-events: none;
    }
    .blob-1 { width: 400px; height: 400px; background: var(--sage); top: -100px; left: -100px; }
    .blob-2 { width: 500px; height: 500px; background: var(--honey); bottom: -150px; right: -150px; }

    .grain {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        opacity: 0.03;
        z-index: 1;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Main Card Container */
    .error-card {
        position: relative;
        z-index: 10;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 30px 60px -20px rgba(44, 36, 32, 0.08);
        max-width: 900px;
        width: 90%;
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        overflow: hidden;
    }

    /* Content Side */
    .content-side {
        padding: 4rem 3.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: left;
    }

    .label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--cream-deep);
        color: var(--terracotta);
        padding: 0.4rem 0.8rem;
        border-radius: 100px;
        font-family: 'Outfit', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        width: fit-content;
        margin-bottom: 2rem;
    }

    .label::before {
        content: '';
        width: 6px;
        height: 6px;
        background: var(--terracotta);
        border-radius: 50%;
    }

    .error-code {
        font-family: 'Outfit', sans-serif;
        font-size: 6rem;
        font-weight: 800;
        color: var(--bark);
        line-height: 1;
        margin-bottom: 1.5rem;
        letter-spacing: -0.04em;
    }

    .error-code span {
        color: var(--terracotta);
    }

    .title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--bark);
        margin-bottom: 1rem;
        line-height: 1.2;
    }

    .subtitle {
        color: var(--bark-soft);
        font-size: 1.05rem;
        line-height: 1.7;
        margin-bottom: 2.5rem;
        max-width: 400px;
    }

    /* Action Buttons */
    .actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 1.5rem;
        border-radius: 10px;
        text-decoration: none;
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: none;
    }

    .btn-primary {
        background: var(--teal);
        color: #fff;
    }

    .btn-primary:hover {
        background: var(--teal-deep);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(42, 111, 101, 0.4);
    }

    .btn-secondary {
        background: transparent;
        color: var(--bark);
        border: 1px solid var(--border);
    }

    .btn-secondary:hover {
        background: var(--cream-deep);
        border-color: var(--bark-soft);
    }

    /* Illustration Side */
    .illustration-side {
        background: var(--cream-deep);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        border-left: 1px solid var(--border);
    }

    .botanical-svg {
        width: 100%;
        max-width: 300px;
        height: auto;
        overflow: visible;
    }

    /* Subtle animations for the SVG */
    .leaf {
        transform-origin: bottom center;
        animation: sway 6s ease-in-out infinite;
    }
    .leaf-1 { animation-delay: 0s; }
    .leaf-2 { animation-delay: 1.5s; }
    .leaf-3 { animation-delay: 3s; }

    @keyframes sway {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
    }

    .ground {
        animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .error-card {
            grid-template-columns: 1fr;
            max-width: 450px;
        }
        .illustration-side {
            padding: 3rem 2rem;
            border-left: none;
            border-top: 1px solid var(--border);
            order: -1; /* Show illustration on top for mobile */
        }
        .content-side {
            padding: 3rem 2rem;
            text-align: center;
            align-items: center;
        }
        .subtitle {
            text-align: center;
        }
        .actions {
            justify-content: center;
        }
        .error-code {
            font-size: 4.5rem;
        }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
        .leaf, .ground {
            animation: none;
        }
    }
</style>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="grain"></div>

    <main class="error-card">
        <!-- Text Content -->
        <div class="content-side">
            <div class="label">Error 404</div>
            <div class="error-code">4<span>0</span>4</div>
            <h1 class="title">Lost in the Garden</h1>
            <p class="subtitle">It looks like the path you were looking for has overgrown. The page may have been moved, deleted, or never existed at all. Let's get you back to safety.</p>
            
            <div class="actions">
                <a href="index.html" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Return Home
                </a>
                <button class="btn btn-secondary" onclick="history.back()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    Go Back
                </button>
            </div>
        </div>

        <!-- SVG Illustration -->
        <div class="illustration-side">
            <svg class="botanical-svg" viewBox="0 0 200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Pot -->
                <g class="ground">
                    <path d="M50 140 L60 220 C60 225 65 230 70 230 L130 230 C135 230 140 225 140 220 L150 140 Z" fill="#FFFFFF" stroke="#2C2420" stroke-width="3"/>
                    <path d="M45 140 L155 140 L155 148 C155 153 150 157 145 157 L55 157 C50 157 45 153 45 148 Z" fill="#2C2420"/>
                </g>

                <!-- Soil -->
                <ellipse cx="100" cy="142" rx="48" ry="6" fill="#6B5D52"/>

                <!-- Stems -->
                <path d="M100 140 C100 120 80 100 85 80" stroke="#2C2420" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M100 140 C100 110 120 90 115 70" stroke="#2C2420" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M100 140 C100 100 100 70 100 50" stroke="#2C2420" stroke-width="2.5" stroke-linecap="round"/>

                <!-- Leaves (Sage Green) -->
                <!-- Left Leaf -->
                <g class="leaf leaf-1">
                    <path d="M85 80 C60 60 40 65 35 80 C32 95 45 105 50 100 C60 95 80 85 85 80 Z" fill="#8AA68B" stroke="#2C2420" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M35 80 C45 85 60 80 85 80" stroke="#2C2420" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
                </g>

                <!-- Right Leaf -->
                <g class="leaf leaf-2">
                    <path d="M115 70 C140 50 160 55 165 70 C168 85 155 95 150 90 C140 85 120 75 115 70 Z" fill="#8AA68B" stroke="#2C2420" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M165 70 C155 75 140 70 115 70" stroke="#2C2420" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
                </g>

                <!-- Top Leaf -->
                <g class="leaf leaf-3">
                    <path d="M100 50 C85 20 70 15 60 25 C50 35 55 55 65 55 C80 55 95 55 100 50 Z" fill="#8AA68B" stroke="#2C2420" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M60 25 C75 35 90 40 100 50" stroke="#2C2420" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
                </g>
            </svg>
        </div>
    </main>
</body>
</html>
