<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tinkers Moments | Tinkers Hatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Lexend:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css?v=3.9">
<style>
        body { background: var(--cream); }
        
        /* Sticky Header */
        .photo-header { 
            position: sticky; top: 0; 
            background: color-mix(in srgb, var(--cream) 85%, transparent); 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); z-index: 100; 
        }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--bark); font-weight: 700; background: var(--cream-deep); padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border); transition: all 0.2s; }
        .back-btn:hover { background: var(--teal); color: #fff; border-color: var(--teal); }
        
        /* Large Single-Column Layout */
        .gallery-masonry { 
            column-count: 1; 
            column-gap: 24px; 
            max-width: 600px; /* Prevents photos from getting too blurry on large monitors */
            margin: 40px auto; 
            padding: 0 16px; 
        }
        
        /* Accessible Photo Buttons */
        .photo-item { 
            position: relative; 
            width: 100%; 
            display: block; 
            margin-bottom: 24px; 
            break-inside: avoid; /* Masonry fix */
            border: none; 
            padding: 0; 
            background: none; 
            cursor: pointer; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .photo-item img { width: 100%; display: block; transition: transform 0.4s ease; }
        .photo-item:focus { outline: 3px solid var(--teal); outline-offset: 3px; }
        .photo-item:hover img { transform: scale(1.03); }
        
        /* Hover Overlay */
        .photo-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; padding: 16px; text-align: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .photo-item:hover .photo-overlay, .photo-item:focus-visible .photo-overlay { opacity: 1; }
        .photo-overlay svg { color: #fff; width: 36px; height: 36px; }
        .photo-overlay span { color: #fff; font-size: 0.95rem; font-weight: 600; }
        
        /* Skeleton Loading */
        .skeleton-box { width: 100%; border-radius: 16px; margin-bottom: 24px; background: var(--cream-deep); height: 450px; animation: skeleton-pulse 1.5s infinite ease-in-out; break-inside: avoid; }
        @keyframes skeleton-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        /* Lightbox Caption */
        .lightbox-caption { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 1rem; font-weight: 600; background: rgba(0,0,0,0.6); padding: 12px 24px; border-radius: 20px; backdrop-filter: blur(8px); text-align: center; max-width: 80%; }
        
        /* Floating Back to Top */
        .back-to-top { position: fixed; bottom: 24px; right: 24px; width: 48px; height: 48px; border-radius: 12px; background: var(--bark); color: #fff; border: none; display: none; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: all 0.3s ease; z-index: 90; }
        .back-to-top.show { display: flex; }
        .back-to-top:hover { background: var(--teal); transform: translateY(-3px); }
    </style>
    <!-- Theme Loader Script (Matches main site settings) -->
<script>
    (function() {
        try {
            const html = document.documentElement;
            // Create the body element if it doesn't exist yet so we can style it instantly
            const body = document.body || document.createElement('body');
            
            const theme = localStorage.getItem('th-theme');
            const palette = localStorage.getItem('th-palette');
            const fontsize = localStorage.getItem('th-fontsize');
            const dyslexia = localStorage.getItem('th-dyslexia');
            const season = localStorage.getItem('th-season');

            // 1. Apply Theme (Dark, Warm, High Contrast)
            if (theme && theme !== 'light') body.classList.add('theme-' + theme);
            
            // 2. Apply Palette (Ocean, Sunset, Berry)
            if (palette && palette !== 'nature') body.classList.add('palette-' + palette);
            
            // 3. Apply Font Size (applied to HTML tag like the main site)
            if (fontsize) {
                html.classList.add('th-text-' + fontsize);
                if (fontsize === 'bold') body.classList.add('th-text-bold');
            }
            
            // 4. Apply Dyslexia Mode
            if (dyslexia === 'on') body.classList.add('dyslexia-mode');
            
            // 5. Apply Seasonal Theme if it's set
            if (season && season !== 'auto') body.classList.add('season-' + season);

        } catch (e) {
            console.log('Theme could not be loaded.');
        }
    })();
</script>
</head>
<body>

    <header class="photo-header">
        <a href="index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Site
        </a>
        <h1 class="display font-extrabold text-xl" style="color: var(--bark);">Tinkers Moments</h1>
        <div style="width: 110px;"></div> <!-- Spacer to center title -->
    </header>

    <main style="padding-top: 20px; padding-bottom: 60px;">
        <div id="photoGrid" class="gallery-masonry">
            <!-- Skeleton Loaders -->
            <div class="skeleton-box" style="height: 450px;"></div>
            <div class="skeleton-box" style="height: 500px;"></div>
            <div class="skeleton-box" style="height: 400px;"></div>
            <div class="skeleton-box" style="height: 550px;"></div>
        </div>
    </main>

    <!-- Floating Back to Top -->
    <button class="back-to-top" id="backToTopBtn" aria-label="Scroll back to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Photo gallery viewer">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close image viewer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <button class="lightbox-nav-btn lightbox-prev" id="lightboxPrev" aria-label="Previous image"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <img id="lightboxImg" class="lightbox-img" src="" alt="Expanded photo view">
        <button class="lightbox-nav-btn lightbox-next" id="lightboxNext" aria-label="Next image"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
        <div id="lightboxCounter" class="lightbox-counter">1 / 1</div>
        <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>

    <script>
        (async function() {
            const supabaseUrl = 'https://bsbwrvqevtoujfvcvvju.supabase.co';
            const supabaseKey = 'sb_publishable_c6IrevCpSel1njeKV0PhEA_Rbw2UdAx';
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            
            const grid = document.getElementById('photoGrid');
            let photos = [];
            let currentIndex = 0;

            // Lightbox Elements
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightboxImg');
            const lbClose = document.getElementById('lightboxClose');
            const lbPrev = document.getElementById('lightboxPrev');
            const lbNext = document.getElementById('lightboxNext');
            const lbCounter = document.getElementById('lightboxCounter');
            const lbCaption = document.getElementById('lightboxCaption');

            async function loadPhotos() {
                try {
                    const { data, error } = await supabase.storage.from('gallery').list('', { limit: 100, offset: 0, sortBy: { column: 'created_at', order: 'desc' } });
                    if (error) throw error;

                    if (!data || data.length === 0) {
                        grid.innerHTML = '<p style="color: var(--bark-soft); text-align: center; padding: 40px;">No photos yet. Check back soon!</p>';
                        return;
                    }

                    photos = data.filter(f => !f.name.startsWith('.')).map(file => {
                        const { data: urlData } = supabase.storage.from('gallery').getPublicUrl(file.name);
                        let alt = 'Gallery Photo';
                        if (file.name.includes('_caption_')) {
                            const match = file.name.split('_caption_')[1];
                            if (match) alt = match.replace(/\.jpg|\.png|\.jpeg/gi, '').replace(/-/g, ' ');
                        }
                        return { src: urlData.publicUrl, alt: alt };
                    });

                    renderGrid();
                } catch (e) {
                    grid.innerHTML = '<p style="color: var(--terracotta); text-align: center; padding: 40px;">Could not load photos.</p>';
                }
            }

            function renderGrid() {
                grid.innerHTML = ''; // Clear skeletons
                photos.forEach((photo, idx) => {
                    // 1. Create Accessible Button Wrapper
                    const btn = document.createElement('button');
                    btn.className = 'photo-item';
                    btn.setAttribute('aria-label', `Open photo: ${photo.alt}`);
                    
                    // 2. Create Image
                    const img = document.createElement('img');
                    img.src = photo.src;
                    img.alt = photo.alt;
                    img.loading = 'lazy';
                    
                    // 3. Create Hover Overlay
                    const overlay = document.createElement('div');
                    overlay.className = 'photo-overlay';
                    overlay.innerHTML = `
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        ${photo.alt !== 'Gallery Photo' ? `<span>${photo.alt}</span>` : ''}
                    `;
                    
                    btn.appendChild(img);
                    btn.appendChild(overlay);
                    btn.addEventListener('click', () => openLightbox(idx));
                    grid.appendChild(btn);
                });
            }

            // --- Lightbox Logic ---
            function openLightbox(index) {
                currentIndex = index;
                updateLightbox();
                lb.classList.add('active');
                document.body.style.overflow = 'hidden'; // Lock background scroll
            }

            function closeLightbox() {
                lb.classList.remove('active');
                document.body.style.overflow = ''; // Unlock background scroll
            }

            function updateLightbox() {
                lbImg.src = photos[currentIndex].src;
                lbImg.alt = photos[currentIndex].alt;
                lbCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
                
                if (photos[currentIndex].alt && photos[currentIndex].alt !== 'Gallery Photo') {
                    lbCaption.textContent = photos[currentIndex].alt;
                    lbCaption.style.display = 'block';
                } else {
                    lbCaption.style.display = 'none';
                }
            }

            function nextPhoto() { currentIndex = (currentIndex + 1) % photos.length; updateLightbox(); }
            function prevPhoto() { currentIndex = (currentIndex - 1 + photos.length) % photos.length; updateLightbox(); }

            // Listeners
            lbClose.addEventListener('click', closeLightbox);
            lbNext.addEventListener('click', e => { e.stopPropagation(); nextPhoto(); });
            lbPrev.addEventListener('click', e => { e.stopPropagation(); prevPhoto(); });
            lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
            document.addEventListener('keydown', e => {
                if (!lb.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') nextPhoto();
                if (e.key === 'ArrowLeft') prevPhoto();
            });

            // Touch Swipe Listeners for Mobile
            let touchStartX = 0;
            lb.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
            lb.addEventListener('touchend', e => {
                if (!lb.classList.contains('active')) return;
                const touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) { 
                    if (diff > 0) nextPhoto(); else prevPhoto();
                }
            }, {passive: true});

            // --- Back to Top Logic ---
            const backToTopBtn = document.getElementById('backToTopBtn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) backToTopBtn.classList.add('show');
                else backToTopBtn.classList.remove('show');
            });
            backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            // Initialize
            loadPhotos();
        })();
    </script>
</body>
</html>
